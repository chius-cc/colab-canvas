name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dev dependencies
        run: python -m pip install --upgrade pip && pip install -e "./backend[dev]"
      - name: Ruff lint
        run: cd backend && ruff check app tests ../scripts
      - name: Pytest suite
        run: cd backend && pytest -v
      - name: Verify colab_cli boundary
        run: |
          matches=$(grep -rn "colab_cli" backend/app/ || true)
          echo "$matches"
          non_gateway=$(echo "$matches" | grep -v '^backend/app/colab/gateway\.py:' || true)
          if [ -n "$non_gateway" ]; then
            echo "ERROR: colab_cli referenced outside backend/app/colab/gateway.py"
            exit 1
          fi

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: TypeScript check & Vite build
        run: cd frontend && pnpm exec tsc --noEmit && pnpm build
      - name: Verify zero T4 GPU offers in UI source
        run: |
          if grep -rn "T4" frontend/src/; then
            echo "ERROR: T4 must never be offered in frontend/src/"
            exit 1
          fi

  docker-check:
    name: Docker Build Check (linux/amd64)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
