name: Release & Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag e.g. v0.1.0; leave empty to publish edge image only"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install & test backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          cd backend
          ruff check app tests ../scripts
          pytest -v
      - name: Verify colab_cli boundary
        run: |
          matches=$(grep -rn "colab_cli" backend/app/ || true)
          non_gateway=$(echo "$matches" | grep -v '^backend/app/colab/gateway\.py:' || true)
          if [ -n "$non_gateway" ]; then
            echo "ERROR: colab_cli referenced outside backend/app/colab/gateway.py"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Typecheck & build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build
          if grep -rn "T4" src/; then
            echo "ERROR: T4 must never be offered in frontend/src/"
            exit 1
          fi

  publish-image:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute image metadata & tags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO_LOWER}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${INPUT_TAG}"
          fi

          TAGS=("${IMAGE}:sha-${SHORT_SHA}")
          IS_PRERELEASE="false"

          if [[ -n "${RELEASE_TAG}" ]]; then
            if ! [[ "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: Invalid release tag '${RELEASE_TAG}'. Expected format like v0.1.0"
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SUFFIX="${BASH_REMATCH[4]}"
            VERSION="${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"

            TAGS+=("${IMAGE}:${RELEASE_TAG}" "${IMAGE}:${VERSION}")

            if [[ "${INPUT_PRERELEASE}" == "true" || "${RELEASE_TAG}" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              TAGS+=("${IMAGE}:${MAJOR}.${MINOR}" "${IMAGE}:latest")
            fi
          else
            TAGS+=("${IMAGE}:edge")
          fi

          {
            echo "image=${IMAGE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Computed image: ${IMAGE}"
          printf 'Computed tags:\n%s\n' "${TAGS[*]}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch OCI image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.release_tag || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-image
    if: needs.publish-image.outputs.release_tag != ''
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.publish-image.outputs.release_tag }}
      IMAGE: ${{ needs.publish-image.outputs.image }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
      IS_PRERELEASE: ${{ needs.publish-image.outputs.is_prerelease }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          EXTRA_TAG=""
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            EXTRA_TAG="docker pull ${IMAGE}:latest"$'\n'
          fi
          CONTAINER_NOTES=$(cat <<EOF
          ### Container Images (linux/amd64, linux/arm64)

          \`\`\`bash
          docker pull ${IMAGE}:${RELEASE_TAG}
          ${EXTRA_TAG}\`\`\`

          - **Digest**: \`${DIGEST}\`
          EOF
          )

          PRERELEASE_FLAG=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "${CONTAINER_NOTES}" \
              "${PRERELEASE_FLAG[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${TARGET_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --notes "${CONTAINER_NOTES}" \
              "${PRERELEASE_FLAG[@]}"
          fi
