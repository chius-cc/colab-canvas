[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colab-canvas-backend"
version = "0.2.3"
description = "Self-hosted AI Art Studio & Multi-Account Google Colab GPU Pool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiosqlite>=0.21.0",
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "google-colab-cli==0.8.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
