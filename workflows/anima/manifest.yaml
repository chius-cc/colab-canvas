id: anima
name: Anima
description: CircleStone Labs & Comfy Org 2B anime illustration model (Qwen3-0.6B + Cosmos-Predict2-2B)
comfyui_commit: "4a4b3409792d499cc36626d76a24fe425f40b5e7"
default_gpu: L4
prompt_hint: "Anima uses Qwen3-0.6B: Danbooru tags + natural language work best; CLIP weight syntax like (tag:1.3) does not behave like SDXL."
supports_loras: true
max_loras: 4

shared_weights:
  - repo_id: circlestone-labs/Anima
    repo_path: split_files/text_encoders/qwen_3_06b_base.safetensors
    target_path: text_encoders/qwen_3_06b_base.safetensors
    sha256: cd2a512003e2f9f3cd3c32a9c3573f820bb28c940f73c57b1ddaa983d9223eba
    size_bytes: 1192135096
  - repo_id: circlestone-labs/Anima
    repo_path: split_files/vae/qwen_image_vae.safetensors
    target_path: vae/qwen_image_vae.safetensors
    sha256: a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f
    size_bytes: 253806246

default_variant: turbo
variants:
  turbo:
    label: Anima Turbo v1.1
    description: Distilled fast variant (8-12 steps, CFG 1.0)
    admin_only: false
    weight:
      repo_id: circlestone-labs/Anima
      repo_path: split_files/diffusion_models/anima-turbo-v1.1.safetensors
      target_path: diffusion_models/anima-turbo-v1.1.safetensors
      sha256: fba11953276b57edf59d1dc4f1857ac05aa079c56f982b4d7c20298d57d3f7eb
      size_bytes: 4182230656
    defaults:
      steps: 10
      cfg: 1.0
      sampler_name: euler
      scheduler: simple
      positive_prefix: "masterpiece, best quality, "
      negative_prompt: "worst quality, low quality, score_1, score_2, score_3, blurry, jpeg artifacts"

  aesthetic:
    label: Anima Aesthetic v1.1
    description: Fine-tuned high-quality illustration variant (30 steps)
    admin_only: false
    weight:
      repo_id: circlestone-labs/Anima
      repo_path: split_files/diffusion_models/anima-aesthetic-v1.1.safetensors
      target_path: diffusion_models/anima-aesthetic-v1.1.safetensors
      sha256: 3c1868387a3a1ff504bbb87c33678321965ead381fcf87afbd0264daa600c082
      size_bytes: 4182230656
    defaults:
      steps: 30
      cfg: 4.0
      sampler_name: er_sde
      scheduler: simple
      positive_prefix: "masterpiece, best quality, "
      negative_prompt: "worst quality, low quality, blurry, jpeg artifacts"

  base:
    label: Anima Base v1.0
    description: Unrefined base model for LoRA training reference and comparison
    admin_only: true
    weight:
      repo_id: circlestone-labs/Anima
      repo_path: split_files/diffusion_models/anima-base-v1.0.safetensors
      target_path: diffusion_models/anima-base-v1.0.safetensors
      sha256: bd43b7cffe1ed1153d9c41e7beb2f18cb1273eafbaa3af3edd6a173dc90a006e
      size_bytes: 4182218328
    defaults:
      steps: 30
      cfg: 4.5
      sampler_name: er_sde
      scheduler: simple
      positive_prefix: "masterpiece, best quality, score_7, safe, "
      negative_prompt: "worst quality, low quality, score_1, score_2, score_3, artist name, blurry, jpeg artifacts"

resolution_presets:
  - id: square
    label: "1:1 (1024x1024)"
    width: 1024
    height: 1024
  - id: portrait_tall
    label: "2:3 Portrait (832x1216)"
    width: 832
    height: 1216
  - id: landscape_wide
    label: "3:2 Landscape (1216x832)"
    width: 1216
    height: 832
  - id: portrait_std
    label: "3:4 Portrait (896x1152)"
    width: 896
    height: 1152
  - id: landscape_std
    label: "4:3 Landscape (1152x896)"
    width: 1152
    height: 896

bounds:
  min_dimension: 512
  max_dimension: 1536
  dimension_step: 64
  min_steps: 1
  max_steps: 60
  min_cfg: 1.0
  max_cfg: 12.0
  max_batch_size: 4
  allowed_samplers:
    - euler
    - euler_ancestral
    - er_sde
    - dpmpp_2m_sde_gpu
  allowed_schedulers:
    - simple
    - normal
    - karras
